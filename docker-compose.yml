# One coordinator, N workers, Prometheus and Grafana.
#   docker compose up --build --scale worker=3
#   Grafana http://localhost:3000 (anonymous viewer), Prometheus http://localhost:9090, API http://localhost:8080
services:
  coordinator:
    build:
      context: .
      target: coordinator
    command: ["-addr", ":8080", "-data", "/data", "-log-json"]
    volumes:
      - jobq-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      # distroless has no curl; jobqctl ships in the image
      test: ["CMD", "/usr/local/bin/jobqctl", "-coordinator", "http://127.0.0.1:8080", "list", "-limit", "1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    command: ["-coordinator", "http://coordinator:8080", "-concurrency", "2", "-allow", "echo,sh,sleep,true,false"]
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s # worker waits up to 20s for running jobs on SIGTERM

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - coordinator

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  jobq-data:
